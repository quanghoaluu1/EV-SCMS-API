syntax = "proto3";

option csharp_namespace = "BookingGrpc";

package booking;

// Booking gRPC Service
service BookingGrpcService {
  rpc CreateBooking (CreateBookingRequest) returns (CreateBookingReply);
  rpc GetBookingById (GetBookingByIdRequest) returns (GetBookingByIdReply);
  rpc ValidateBookingData (ValidateBookingDataRequest) returns (ValidateBookingDataReply);
  rpc GetBookingStats (GetBookingStatsRequest) returns (BookingStatsReply);
  rpc GetRevenue (GetRevenueRequest) returns (RevenueReply);
  rpc UpdatePaymentStautus (UpdatePaymentStatusRequest) returns (UpdatePaymentStatusReply);
}

// Request/Reply messages
message CreateBookingRequest {
  string customer_id = 1;
  string vehicle_id = 2;
  string staff_id = 3;
  int32 service_type = 4;
  string scheduled_date = 5;
  string notes = 6;
}

message CreateBookingReply {
  bool success = 1;
  string message = 2;
  string booking_id = 3;
  string customer_id = 4;
  string vehicle_id = 5;
  string staff_id = 6;
}

message GetBookingByIdRequest {
  string booking_id = 1;
}

message GetBookingByIdReply {
  bool success = 1;
  string message = 2;
  string booking_id = 3;
  string customer_id = 4;
  string vehicle_id = 5;
  string staff_id = 6;
  int32 service_type = 7;
  string scheduled_date = 8;
  int32 status = 9;
  string notes = 10;
  int32 total_cost = 11;
  string payment_status = 12;
  string created_at = 13;
  string updated_at = 14;
}

message ValidateBookingDataRequest {
  string customer_id = 1;
  string vehicle_id = 2;
  string staff_id = 3;
}

message ValidateBookingDataReply {
  bool success = 1;
  string message = 2;
  ValidationResult customer_validation = 3;
  ValidationResult vehicle_validation = 4;
  ValidationResult staff_validation = 5;
}

message ValidationResult {
  bool is_valid = 1;
  string message = 2;
  string entity_data = 3;
}

// ===== NEW: REPORT MESSAGES =====

message GetBookingStatsRequest {
  // Empty - get all stats
}

message BookingStatsReply {
  bool success = 1;
  string message = 2;
  int32 total = 3;
  int32 pending = 4;
  int32 in_progress = 5;
  int32 completed = 6;
  int32 cancelled = 7;
  int32 today = 8;
  int32 this_week = 9;
  int32 this_month = 10;
  double completion_rate = 11;
}

message GetRevenueRequest {
  // Empty
}

message RevenueReply {
  bool success = 1;
  string message = 2;
  double total = 3;
  double this_month = 4;
  double this_week = 5;
  double today = 6;
  double paid = 7;
  double unpaid = 8;
  double average_per_booking = 9;
}

// ADD THESE MESSAGES:
message UpdatePaymentStatusRequest {
  string booking_id = 1;
  string payment_status = 2;
}

message UpdatePaymentStatusReply {
  bool success = 1;
  string message = 2;
}