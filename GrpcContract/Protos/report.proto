syntax = "proto3";

option csharp_namespace = "ReportGrpc";

package report;

// Report Service
service ReportGrpcService {
  rpc GetDashboardSummary (DashboardSummaryRequest) returns (DashboardSummaryResponse);
  rpc GetAdvancedReport (AdvancedReportRequest) returns (AdvancedReportResponse);
  rpc GetBookingAnalytics (BookingAnalyticsRequest) returns (BookingAnalyticsResponse);
  rpc GetRevenueReport (RevenueReportRequest) returns (RevenueReportResponse);
  rpc GetCustomerInsights (CustomerInsightsRequest) returns (CustomerInsightsResponse);
  rpc GetStaffPerformanceReport (StaffPerformanceRequest) returns (StaffPerformanceResponse);
  rpc GetVehicleUtilizationReport (VehicleUtilizationRequest) returns (VehicleUtilizationResponse);
  rpc GenerateCustomReport (CustomReportRequest) returns (CustomReportResponse);
  rpc ExportReport (ExportReportRequest) returns (ExportReportResponse);
  rpc GetReportHistory (ReportHistoryRequest) returns (ReportHistoryResponse);
}

// Request Messages
message DashboardSummaryRequest {
  string date_range = 1;
  string user_id = 2;
}

message AdvancedReportRequest {
  string report_type = 1;
  string start_date = 2;
  string end_date = 3;
  repeated string filters = 4;
  string group_by = 5;
}

message BookingAnalyticsRequest {
  string start_date = 1;
  string end_date = 2;
  string group_by = 3;
}

message RevenueReportRequest {
  string start_date = 1;
  string end_date = 2;
  string breakdown_type = 3;
}

message CustomerInsightsRequest {
  string customer_id = 1;
  string analysis_type = 2;
  int32 top_n = 3;
}

message StaffPerformanceRequest {
  string start_date = 1;
  string end_date = 2;
  repeated string staff_ids = 3;
}

message VehicleUtilizationRequest {
  string start_date = 1;
  string end_date = 2;
  repeated string vehicle_types = 3;
}

message CustomReportRequest {
  string report_definition = 1;
  repeated ReportParameter parameters = 2;
}

message ExportReportRequest {
  string report_id = 1;
  string format = 2;
  repeated string columns = 3;
}

message ReportHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// Response Messages
message DashboardSummaryResponse {
  bool success = 1;
  string message = 2;
  DashboardData data = 3;
}

message AdvancedReportResponse {
  bool success = 1;
  string message = 2;
  ReportData data = 3;
}

message BookingAnalyticsResponse {
  bool success = 1;
  string message = 2;
  BookingAnalyticsData data = 3;
}

message RevenueReportResponse {
  bool success = 1;
  string message = 2;
  RevenueData data = 3;
}

message CustomerInsightsResponse {
  bool success = 1;
  string message = 2;
  CustomerInsightsData data = 3;
}

message StaffPerformanceResponse {
  bool success = 1;
  string message = 2;
  repeated StaffPerformanceData staff_performance = 3;
}

message VehicleUtilizationResponse {
  bool success = 1;
  string message = 2;
  repeated VehicleUtilizationData vehicle_utilization = 3;
}

message CustomReportResponse {
  bool success = 1;
  string message = 2;
  string report_id = 3;
  ReportData data = 4;
}

message ExportReportResponse {
  bool success = 1;
  string message = 2;
  bytes file_data = 3;
  string file_name = 4;
  string content_type = 5;
}

message ReportHistoryResponse {
  bool success = 1;
  string message = 2;
  repeated ReportHistoryItem reports = 3;
  int32 total_count = 4;
}

// Data Models
message DashboardData {
  int32 total_customers = 1;
  int32 total_staff = 2;
  int32 total_bookings = 3;
  int32 total_vehicles = 4;
  int32 today_bookings = 5;
  double total_revenue = 6;
  repeated BookingTrend booking_trends = 7;
  repeated PopularVehicle popular_vehicles = 8;
  repeated StaffPerformanceData staff_performance = 9;
  string generated_at = 10;
}

message ReportData {
  string report_type = 1;
  string generated_at = 2;
  repeated ReportRow rows = 3;
  ReportMetadata metadata = 4;
}

message BookingAnalyticsData {
  repeated BookingMetric metrics = 1;
  repeated BookingTrend trends = 2;
  BookingSummary summary = 3;
}

message RevenueData {
  double total_revenue = 1;
  repeated RevenueBreakdown breakdown = 2;
  repeated RevenueTrend trends = 3;
  RevenueComparison comparison = 4;
}

message CustomerInsightsData {
  CustomerProfile profile = 1;
  repeated CustomerBehavior behaviors = 2;
  CustomerSegmentation segmentation = 3;
  repeated Recommendation recommendations = 4;
}

message StaffPerformanceData {
  string staff_id = 1;
  string staff_name = 2;
  int32 completed_bookings = 3;
  double average_rating = 4;
  double revenue_generated = 5;
  int32 customer_satisfaction_score = 6;
  repeated PerformanceMetric metrics = 7;
}

message VehicleUtilizationData {
  string vehicle_id = 1;
  string vehicle_name = 2;
  string vehicle_type = 3;
  double utilization_rate = 4;
  int32 total_bookings = 5;
  double revenue_generated = 6;
  int32 maintenance_events = 7;
}

// Helper Messages
message BookingTrend {
  string date = 1;
  int32 booking_count = 2;
  double revenue = 3;
}

message PopularVehicle {
  string vehicle_id = 1;
  string vehicle_name = 2;
  int32 booking_count = 3;
}

message ReportParameter {
  string name = 1;
  string value = 2;
  string type = 3;
}

message ReportRow {
  repeated ReportCell cells = 1;
}

message ReportCell {
  string column_name = 1;
  string value = 2;
  string data_type = 3;
}

message ReportMetadata {
  int32 total_rows = 1;
  repeated ColumnDefinition columns = 2;
  string query_execution_time = 3;
}

message ColumnDefinition {
  string name = 1;
  string data_type = 2;
  bool is_sortable = 3;
  bool is_filterable = 4;
}

message BookingMetric {
  string metric_name = 1;
  double value = 2;
  string unit = 3;
  double change_percentage = 4;
}

message BookingSummary {
  int32 total_bookings = 1;
  int32 completed_bookings = 2;
  int32 cancelled_bookings = 3;
  int32 pending_bookings = 4;
  double completion_rate = 5;
  double cancellation_rate = 6;
}

message RevenueBreakdown {
  string category = 1;
  double amount = 2;
  double percentage = 3;
}

message RevenueTrend {
  string period = 1;
  double amount = 2;
  double growth_rate = 3;
}

message RevenueComparison {
  double current_period = 1;
  double previous_period = 2;
  double change_percentage = 3;
  string comparison_type = 4;
}

message CustomerProfile {
  string customer_id = 1;
  string name = 2;
  int32 total_bookings = 3;
  double total_spent = 4;
  string registration_date = 5;
  string last_booking_date = 6;
  string preferred_vehicle_type = 7;
}

message CustomerBehavior {
  string behavior_type = 1;
  string description = 2;
  double frequency = 3;
  string trend = 4;
}

message CustomerSegmentation {
  string segment = 1;
  string description = 2;
  double score = 3;
}

message Recommendation {
  string type = 1;
  string title = 2;
  string description = 3;
  double priority = 4;
}

message PerformanceMetric {
  string metric_name = 1;
  double value = 2;
  string benchmark = 3;
  string status = 4;
}

message ReportHistoryItem {
  string report_id = 1;
  string report_type = 2;
  string generated_at = 3;
  string generated_by = 4;
  string status = 5;
  string file_path = 6;
}