syntax = "proto3";

option csharp_namespace = "VehicleGrpc";
package VehicleService;

service VehicleGrpcService {
  rpc CreateVehicle (CreateVehicleRequest) returns (CreateVehicleReply);
  rpc GetVehicleById (GetVehicleByIdRequest) returns (GetVehicleByIdReply);
  rpc GetVehiclesByCustomerId (GetVehiclesByCustomerIdRequest) returns (GetVehiclesByCustomerIdReply);
  rpc GetAllVehicles (Empty) returns (GetAllVehiclesReply);
  rpc UpdateVehicle (UpdateVehicleRequest) returns (UpdateVehicleReply);
  rpc DeleteVehicle (DeleteVehicleRequest) returns (DeleteVehicleReply);
}

message CreateVehicleRequest {
  string customerId = 1; // GUID string
  string model = 2;
  string vin = 3;
  string licensePlate = 4;
  int32 year = 5;
  int32 odometerKm = 6;
  string status = 7;
}

message CreateVehicleReply {
  bool success = 1;
  string message = 2;
  string vehicleId = 3; // GUID string when success
  string customerId = 4; // echo back
}

message GetVehicleByIdRequest {
  string vehicleId = 1; // GUID string
}

message GetVehicleByIdReply {
  bool success = 1;
  string message = 2;
  string vehicleId = 3;
  string customerId = 4;
  string model = 5;
  string vin = 6;
  string licensePlate = 7;
  int32 year = 8;
  int32 odometerKm = 9;
  string status = 10;
  string createdAt = 11; // ISO date-time
}

message GetVehiclesByCustomerIdRequest {
  string customerId = 1; // GUID string
}

message GetVehiclesByCustomerIdReply {
  bool success = 1;
  string message = 2;
  string customerId = 3;
  repeated VehicleInfo vehicles = 4;
}

message GetAllVehiclesReply {
  bool success = 1;
  string message = 2;
  repeated VehicleInfo vehicles = 3;
}

message UpdateVehicleRequest {
  string vehicleId = 1; // GUID string
  string model = 2;
  string vin = 3;
  string licensePlate = 4;
  int32 year = 5;
  int32 odometerKm = 6;
  string status = 7;
}

message UpdateVehicleReply {
  bool success = 1;
  string message = 2;
  string vehicleId = 3;
  string customerId = 4;
}

message DeleteVehicleRequest {
  string vehicleId = 1; // GUID string
}

message DeleteVehicleReply {
  bool success = 1;
  string message = 2;
  string vehicleId = 3;
}

// Common message for vehicle information
message VehicleInfo {
  string vehicleId = 1;
  string customerId = 2;
  string model = 3;
  string vin = 4;
  string licensePlate = 5;
  int32 year = 6;
  int32 odometerKm = 7;
  string status = 8;
  string createdAt = 9; // ISO date-time
}

message Empty {}