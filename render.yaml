

services:
  # =============================================================================
  # API Gateway (Ocelot) - Main Entry Point
  # =============================================================================
  - type: web
    name: evscms-api-gateway
    env: docker
    dockerfilePath: ApiGateway/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: API_GATEWAY_HOST
        value: https://ev-scms-api-gateway.onrender.com
      - key: AUTH_API_HOST
        value: ev-scms-auth-api.onrender.com
      - key: BOOKING_API_HOST
        value: ev-scms-booking-api.onrender.com
      - key: CHAT_API_HOST
        value: ev-scms-chat-api.onrender.com
      - key: CUSTOMER_API_HOST
        value: ev-scms-customer-api.onrender.com
      - key: INVENTORY_API_HOST
        value: ev-scms-inventory-api.onrender.com
      - key: MAINTENANCE_API_HOST
        value: ev-scms-maintenance-api.onrender.com
      - key: NOTIFICATION_API_HOST
        value: ev-scms-notification-api.onrender.com
      - key: PAYMENT_API_HOST
        value: ev-scms-payment-api.onrender.com
      - key: REPORT_API_HOST
        value: ev-scms-report-api.onrender.com
      - key: STAFF_API_HOST
        value: ev-scms-staff-api.onrender.com
      - key: VEHICLE_API_HOST
        value: ev-scms-vehicle-api.onrender.com

  # =============================================================================
  # Auth Service - Authentication & Authorization
  # =============================================================================
  - type: web
    name: evscms-auth-api
    env: docker
    dockerfilePath: Services/Auth/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: RedisSettings__ConnectionString
        sync: false # Configure in Render dashboard (Redis connection string)
      - key: RedisSettings__InstanceName
        value: AuthApiInstance
      - key: Jwt__Key
        sync: false # Configure in Render dashboard (use: openssl rand -base64 32)
      - key: Jwt__Issuer
        value: evscms-issuer
      - key: Jwt__Audience
        value: evscms-audience
      - key: Jwt__ExpiresInMinutes
        value: "120"
      - key: SendGrid__ApiKey
        sync: false # Configure in Render dashboard
      - key: SendGrid__FromEmail
        sync: false # Configure in Render dashboard
      - key: SendGrid__FromName
        sync: false # Configure in Render dashboard
      - key: OtpSettings__OtpLength
        value: "6"
      - key: OtpSettings__ExpiryMinutes
        value: "5"
      - key: OtpSettings__MaxAttempts
        value: "3"
      - key: OtpSettings__ResendCooldownSeconds
        value: "60"
      - key: StaffHost
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Booking Service
  # =============================================================================
  - type: web
    name: evscms-booking-api
    env: docker
    dockerfilePath: Services/Booking/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard
      - key: VehicleHost
        sync: false # Configure in Render dashboard
      - key: StaffHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Chat Service - Real-time Chat with AI Support
  # =============================================================================
  - type: web
    name: evscms-chat-api
    env: docker
    dockerfilePath: Services/Chat/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: MongoDbSettings__ConnectionString
        sync: false # Configure in Render dashboard (MongoDB connection string)
      - key: MongoDbSettings__DatabaseName
        value: chatdb
      - key: RedisSettings__ConnectionString
        sync: false # Configure in Render dashboard (Redis connection string)
      - key: RedisSettings__InstanceName
        value: ChatService
      - key: JwtSettings__Key
        sync: false # Configure in Render dashboard (use: openssl rand -base64 32)
      - key: JwtSettings__Issuer
        value: evscms-issuer
      - key: JwtSettings__Audience
        value: evscms-audience
      - key: JwtSettings__ExpiresInMinutes
        value: "120"
      - key: GeminiSettings__ApiKey
        sync: false # Configure in Render dashboard (Google Gemini API key)
      - key: GeminiSettings__ModelId
        value: gemini-2.5-flash
      - key: StaffHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Customer Service
  # =============================================================================
  - type: web
    name: evscms-customer-api
    env: docker
    dockerfilePath: Services/Customer/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: AuthHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Inventory Service
  # =============================================================================
  - type: web
    name: evscms-inventory-api
    env: docker
    dockerfilePath: Services/Inventory/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Maintenance Service
  # =============================================================================
  - type: web
    name: evscms-maintenance-api
    env: docker
    dockerfilePath: Services/Maintenance/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard
      - key: VehicleHost
        sync: false # Configure in Render dashboard
      - key: StaffHost
        sync: false # Configure in Render dashboard
      - key: BookingHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Notification Service
  # =============================================================================
  - type: web
    name: evscms-notification-api
    env: docker
    dockerfilePath: Services/Notification/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      # - key: ConnectionStrings__DefaultConnection
      #   sync: false # Configure in Render dashboard
      - key: RabbitMQ__ConnectionString
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Payment Service
  # =============================================================================
  - type: web
    name: evscms-payment-api
    env: docker
    dockerfilePath: Services/Payment/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
