      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      # - key: ConnectionStrings__DefaultConnection
      #   sync: false # Configure in Render dashboard
      - key: BookingHost
        sync: false # Configure in Render dashboard
      - key: MaintenanceHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Staff Service
  # =============================================================================
  - type: web
    name: evscms-staff-api
    env: docker
    dockerfilePath: Services/Staff/Dockerfile
    plan: free
    region: singapore
