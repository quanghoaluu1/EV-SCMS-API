# =============================================================================
# Render.com Blueprint - EV-SCMS Microservices
# =============================================================================
#
# Deploy all services with this file:
# 1. Push this render.yaml to the root of your GitHub repository
# 2. Go to Render Dashboard → New → Blueprint
# 3. Connect your GitHub repository
# 4. Render will detect this render.yaml and build all services automatically
#
# All services will:
# - Auto-deploy from main branch on push
# - Use Docker with their respective Dockerfiles
# - Expose port 8080
# - Run on Free tier (services spin down after 15 min of inactivity)
#
# IMPORTANT: After deployment, configure sensitive environment variables
# (marked with sync: false) manually in each service's dashboard.
#
# =============================================================================

services:
  # =============================================================================
  # API Gateway (Ocelot) - Main Entry Point
  # =============================================================================
  - type: web
    name: ev-scms-api-gateway
    env: docker
    dockerfilePath: ApiGateway/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: API_GATEWAY_HOST
        value: https://ev-scms-api-gateway.onrender.com
      - key: AUTH_API_HOST
        value: ev-scms-auth-api.onrender.com
      - key: BOOKING_API_HOST
        value: ev-scms-booking-api.onrender.com
      - key: CUSTOMER_API_HOST
        value: ev-scms-customer-api.onrender.com
      - key: INVENTORY_API_HOST
        value: ev-scms-inventory-api.onrender.com
      - key: MAINTENANCE_API_HOST
        value: ev-scms-maintenance-api.onrender.com
      - key: PAYMENT_API_HOST
        value: ev-scms-payment-api.onrender.com
      - key: REPORT_API_HOST
        value: ev-scms-report-api.onrender.com
      - key: STAFF_API_HOST
        value: ev-scms-staff-api.onrender.com
      - key: VEHICLE_API_HOST
        value: ev-scms-vehicle-api.onrender.com

  # =============================================================================
  # Auth Service - Authentication & Authorization
  # =============================================================================
  - type: web
    name: ev-scms-auth-api
    env: docker
    dockerfilePath: Services/Auth/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: Jwt__Key
        sync: false # Configure in Render dashboard (use: openssl rand -base64 32)
      - key: Jwt__Issuer
        value: ev-scms-auth
      - key: Jwt__Audience
        value: ev-scms-api
      - key: Jwt__ExpiresInMinutes
        value: "120"
      - key: StaffHost
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Booking Service
  # =============================================================================
  - type: web
    name: ev-scms-booking-api
    env: docker
    dockerfilePath: Services/Booking/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard
      - key: VehicleHost
        sync: false # Configure in Render dashboard
      - key: StaffHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Customer Service
  # =============================================================================
  - type: web
    name: ev-scms-customer-api
    env: docker
    dockerfilePath: Services/Customer/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: AuthHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Inventory Service
  # =============================================================================
  - type: web
    name: ev-scms-inventory-api
    env: docker
    dockerfilePath: Services/Inventory/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Maintenance Service
  # =============================================================================
  - type: web
    name: ev-scms-maintenance-api
    env: docker
    dockerfilePath: Services/Maintenance/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard
      - key: VehicleHost
        sync: false # Configure in Render dashboard
      - key: StaffHost
        sync: false # Configure in Render dashboard
      - key: BookingHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Notification Service
  # =============================================================================
  - type: web
    name: ev-scms-notification-api
    env: docker
    dockerfilePath: Services/Notification/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      # - key: ConnectionStrings__DefaultConnection
      #   sync: false # Configure in Render dashboard
      - key: RabbitMQ__ConnectionString
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Payment Service
  # =============================================================================
  - type: web
    name: ev-scms-payment-api
    env: docker
    dockerfilePath: Services/Payment/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: Payos__CLIENT_ID
        sync: false # Configure in Render dashboard
      - key: Payos__API_KEY
        sync: false # Configure in Render dashboard
      - key: Payos__CHECKSUM_KEY
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard
      - key: BookingHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Report Service
  # =============================================================================
  - type: web
    name: ev-scms-report-api
    env: docker
    dockerfilePath: Services/Report/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      # - key: ConnectionStrings__DefaultConnection
      #   sync: false # Configure in Render dashboard
      - key: BookingHost
        sync: false # Configure in Render dashboard
      - key: MaintenanceHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Staff Service
  # =============================================================================
  - type: web
    name: ev-scms-staff-api
    env: docker
    dockerfilePath: Services/Staff/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: AuthHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Vehicle Service
  # =============================================================================
  - type: web
    name: ev-scms-vehicle-api
    env: docker
    dockerfilePath: Services/Vehicle/Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard

