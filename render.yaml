        sync: false # Configure in Render dashboard
      - key: Payos__API_KEY
        sync: false # Configure in Render dashboard
      - key: Payos__CHECKSUM_KEY
        sync: false # Configure in Render dashboard
      - key: CustomerHost
        sync: false # Configure in Render dashboard
      - key: BookingHost
        sync: false # Configure in Render dashboard

  # =============================================================================
  # Report Service
  # =============================================================================
  - type: web
    name: evscms-report-api
    env: docker
    dockerfilePath: Services/Report/Dockerfile
    plan: free
    region: singapore
